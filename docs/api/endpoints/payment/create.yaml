openapi: 3.0.3
info:
  title: ProjectLucy API - Create Payment
  version: 1.0.0
  description: |
    POST /api/payment/create
    Builds a signed SePay checkout form payload and persists a PENDING payment row
    so the IPN webhook can match the result back to this order.
    The frontend should then submit the returned fields (typically by building a
    hidden HTML form and POSTing it to `https://pay.sepay.vn` or
    `https://pay-sandbox.sepay.vn`).
tags:
  - Payment

servers:
  - url: http://localhost:8080
    description: Local Docker container
  - url: http://localhost:5149
    description: Local development

paths:
  /api/payment/create:
    post:
      tags: [Payment]
      summary: Create a signed SePay checkout form
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
            examples:
              valid:
                value:
                  orderInvoiceNumber: "INV_20240101_001"
                  orderAmount: 100000
                  orderDescription: "Thanh toán đơn hàng #12345"
                  customerId: "CUST_001"
                  paymentMethod: "BANK_TRANSFER"
      responses:
        "200":
          description: Form data signed and ready for submission to the SePay gateway.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultOfSePayFormData"
              examples:
                success:
                  value:
                    status: 200
                    message: "Payment form data created"
                    data:
                      orderAmount: "100000"
                      merchant: "SP-TEST-LN696283"
                      currency: "VND"
                      operation: "PURCHASE"
                      orderDescription: "Thanh toán đơn hàng #12345"
                      orderInvoiceNumber: "INV_20240101_001"
                      customerId: "CUST_001"
                      paymentMethod: "BANK_TRANSFER"
                      successUrl: "https://yoursite.com/payment/success"
                      errorUrl: "https://yoursite.com/payment/error"
                      cancelUrl: "https://yoursite.com/payment/cancel"
                      signature: "a1b2c3d4e5f6g7h8..."
                      isSandbox: true
        "400":
          description: DTO-level validation error (DataAnnotations on CreatePaymentRequest)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultOfEmpty"
        "422":
          description: Business validation failed (FluentValidation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultOfValidation"
              examples:
                invoiceDuplicated:
                  summary: order_invoice_number is already in use
                  value:
                    status: 422
                    message: "Validation failed"
                    errors:
                      - "order_invoice_number is already in use"
                invalidAmount:
                  summary: order_amount must be greater than 0
                  value:
                    status: 422
                    message: "Validation failed"
                    errors:
                      - "order_amount must be greater than 0"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  responses:
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResultOfEmpty"
          examples:
            serverError:
              value:
                status: 500
                message: "An unexpected error occurred"
  schemas:
    CreatePaymentRequest:
      type: object
      required: [orderInvoiceNumber, orderAmount, orderDescription]
      properties:
        orderInvoiceNumber:
          type: string
          maxLength: 100
        orderAmount:
          type: integer
          format: int64
          minimum: 1
        orderDescription:
          type: string
          maxLength: 255
        customerId:
          type: string
          maxLength: 100
          nullable: true
        paymentMethod:
          type: string
          maxLength: 50
          nullable: true
          description: One of CARD, BANK_TRANSFER, NAPAS_BANK_TRANSFER.
    SePayFormData:
      type: object
      required:
        - orderAmount
        - merchant
        - currency
        - operation
        - orderDescription
        - orderInvoiceNumber
        - successUrl
        - errorUrl
        - cancelUrl
        - signature
        - isSandbox
      properties:
        orderAmount:
          type: string
        merchant:
          type: string
        currency:
          type: string
          example: "VND"
        operation:
          type: string
          example: "PURCHASE"
        orderDescription:
          type: string
        orderInvoiceNumber:
          type: string
        customerId:
          type: string
          nullable: true
        paymentMethod:
          type: string
          nullable: true
        successUrl:
          type: string
          format: uri
        errorUrl:
          type: string
          format: uri
        cancelUrl:
          type: string
          format: uri
        signature:
          type: string
          description: Base64-encoded HMAC-SHA256 signature.
        isSandbox:
          type: boolean
    ResultOfSePayFormData:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
        data:
          $ref: "#/components/schemas/SePayFormData"
        errors:
          type: array
          items:
            type: string
    ResultOfEmpty:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          nullable: true
        errors:
          type: array
          items:
            type: string
    ResultOfValidation:
      type: object
      required: [status, message, errors]
      properties:
        status:
          type: integer
          example: 422
        message:
          type: string
        errors:
          type: array
          items:
            type: string
