services:
  projectlucy-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: projectlucy-api:latest
    container_name: projectlucy-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      BaseCallbackUrl: ${BASE_CALLBACK_URL:-https://localhost:7270}
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      SePay__UrlSePay: ${SEPAY_URL:-https://pay-sandbox.sepay.vn/v1/checkout/init}
      SePay__ApiKey: ${SEPAY_API_KEY}
      SePay__MerchantId: ${SEPAY_MERCHANT_ID}
      SePay__SecretKey: ${SEPAY_SECRET_KEY}
      SePay__IsSandbox: ${SEPAY_IS_SANDBOX:-true}
      SePay__SuccessUrl: ${SEPAY_SUCCESS_URL}
      SePay__ErrorUrl: ${SEPAY_ERROR_URL}
      SePay__CancelUrl: ${SEPAY_CANCEL_URL}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER:-ProjectLucy.API}
      JwtSettings__Audience: ${JWT_AUDIENCE:-ProjectLucy.Client}
      JwtSettings__AccessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-15}
      JwtSettings__RefreshTokenExpirationDays: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
    restart: unless-stopped
